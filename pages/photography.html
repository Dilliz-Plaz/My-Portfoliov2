<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="icon" type="image/png" href="/Website logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chewy&family=Edu+NSW+ACT+Cursive:wght@400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
    />
    <link rel="stylesheet" href="stylesheet.css" />
    <title>Photography</title>
  </head>
  <body class="bg-[url('../../assets/picnicpattern.png')] bg-repeat bg-size-[]">
    <nav
      id="menu"
      class="font-[edu_nsw_act_cursive] z-50 text-center transition duration-300 opacity-0 hidden"
    >
      <div class="fixed top-0 right-0 z-50 bg-black/70 w-100 h-screen">
        <h2 class="text-white p-10 text-5xl font-bold underline">Legend</h2>
        <ul class="text-2xl font-[roboto] text-white">
          <li>
            <a
              href="../index.html"
              class="hover:underline hover:text-blue-600 hover:font-bold"
              >Home</a
            >
          </li>
          <li>
            <a
              href="../pages/gaming.html"
              class="hover:underline hover:text-green-600 hover:font-bold"
              >Games</a
            >
          </li>
          <li>
            <a
              href="../pages/links.html"
              class="hover:underline hover:text-purple-600 hover:font-bold"
              >Links</a
            >
          </li>
          <li>
            <a
              href="../pages/Experience.html"
              class="hover:underline hover:text-blue-600 hover:font-bold"
              >Experience</a
            >
          </li>
        </ul>
      </div>
    </nav>
    <header class="flex flex-row relative py-6 justify-center">
      <h1 class="text-8xl font-black font-['Chewy']">Photography</h1>
      <div class="">
        <i
          id="menubtn"
          class="ph ph-list text-5xl absolute right-2 hover:rotate-90 transition duration-200"
        ></i>
      </div>
    </header>
    <section>
      <div class="flex flex-wrap gap-20 justify-center-safe overflow-x-clip">
        <div class="-rotate-3 relative inline-block">
          <img
            loading="lazy"
            src="../assets/photos/02030559-EDIT.jpg"
            alt="Photo of green car"
            class="border-10 border-b-100 size-100 object-cover js-popup-trigger cursor-pointer"
          />
          <button>
            <i
              class="ph ph-arrows-out js-popup-trigger absolute bottom-32 right-4 text-2xl text-white cursor-pointer hover:text-black"
            ></i>
          </button>
        </div>
        <div class="rotate-15 relative inline-block">
          <img
            loading="lazy"
            src="../assets/photos/02030613.JPG"
            alt="BC Ferry Worker"
            class="border-10 border-b-100 size-100 object-cover js-popup-trigger cursor-pointer"
          />
          <button>
            <i
              class="ph ph-arrows-out js-popup-trigger absolute bottom-32 right-4 text-2xl text-white cursor-pointer hover:text-black"
            ></i>
          </button>
        </div>
        <div class="rotate-3 relative inline-block">
          <img
            loading="lazy"
            src="../assets/photos/IMG_0771-EDIT.jpg"
            alt="A crow B&W"
            class="border-10 border-b-100 size-100 object-cover js-popup-trigger cursor-pointer"
          />
          <button>
            <i
              class="ph ph-arrows-out js-popup-trigger absolute bottom-32 right-4 text-2xl text-white cursor-pointer hover:text-black"
            ></i>
          </button>
        </div>
        <div class="-rotate-15 relative inline-block">
          <img
            loading="lazy"
            src="../assets/photos/IMG_0795.JPG"
            alt="A brown horse"
            class="border-10 border-b-100 size-100 object-cover js-popup-trigger cursor-pointer"
          />
          <button>
            <i
              class="ph ph-arrows-out absolute bottom-32 right-4 text-2xl text-white hover:text-black"
            ></i>
          </button>
        </div>
        <div class="rotate-4 relative inline-block">
          <img
            loading="lazy"
            src="../assets/photos/IMG_2029.JPG"
            alt="A photo of lighting. Highly edited"
            class="border-10 border-b-100 size-100 object-cover js-popup-trigger cursor-pointer"
          />
          <button>
            <i
              class="ph ph-arrows-out js-popup-trigger absolute bottom-32 right-4 text-2xl text-white cursor-pointer hover:text-black"
            ></i>
          </button>
        </div>
        <div class="-rotate-25 relative inline-block">
          <img
            loading="lazy"
            src="../assets/photos/SAM_0098.JPG"
            alt="A photo of a BC Ferry Car deck"
            class="border-10 border-b-100 size-100 object-cover js-popup-trigger cursor-pointer"
          />
          <button>
            <i
              class="ph ph-arrows-out js-popup-trigger absolute bottom-32 right-4 text-2xl text-white cursor-pointer hover:text-black"
            ></i>
          </button>
        </div>
        <div class="rotate-4 relative inline-block">
          <img
            loading="lazy"
            src="../assets/photos/SAM_0257.JPG"
            alt="A photo of plane."
            class="border-10 border-b-100 size-100 object-cover js-popup-trigger cursor-pointer"
          />
          <button>
            <i
              class="ph ph-arrows-out js-popup-trigger absolute bottom-32 right-4 text-2xl text-white cursor-pointer hover:text-black"
            ></i>
          </button>
        </div>
        <div class="-rotate-19 relative inline-block">
          <img
            loading="lazy"
            src="../assets/photos/IMG_0153.HEIC"
            alt="A photo of a seven eleven"
            class="border-10 border-b-100 size-100 object-cover js-popup-trigger cursor-pointer"
          />
          <button>
            <i
              class="ph ph-arrows-out js-popup-trigger absolute bottom-32 right-4 text-2xl text-white cursor-pointer hover:text-black"
            ></i>
          </button>
        </div>
      </div>

      <div
        id="modal"
        class="hidden fixed inset-0 z-10 bg-black/70 items-center p-4 justify-center"
      >
        <button
          id="close-modal"
          class="absolute top-6 right-6 text-white text-4xl hover:text-gray-300 cursor-pointer p-2"
        >
          <i class="ph ph-x"></i>
        </button>
        <a id="imagelink" target="_blank" rel="noopener noreferrer"
          ><img
            id="modal-image"
            src=""
            alt=""
            class="max-h-screen object-contain rounded-lg shadow-2xl z-100"
          />
        </a>
      </div>
    </section>
  </body>
  <script src="../scripts/photoshower.js"></script>
  <script src="../scripts/menuscript.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2"></script>
</html>
